version: '3.8'

services:
  frontend:
    build:
      context: ./votacions
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./votacions:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./Server:/usr/src/app
      - /usr/src/app/node_modules